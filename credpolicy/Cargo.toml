# The E-OS credential policy, as its own package.
#
# WHY IT IS NOT A MODULE OF `userutils` ANY MORE. It had to be reachable from a SECOND caller --
# the graphical greeter in eos-orbutils -- and a git dependency on the whole `userutils` package
# does not resolve:
#
#     error: failed to select a version for `redox_syscall`
#       ... required by `redox-rt` (relibc), which needs ^0.9.2
#       ... previously selected `redox_syscall v0.9.0`, locked by orbutils
#
# Pulling the library dragged its Redox runtime dependencies along with twelve lines of policy.
#
# THIS PACKAGE HAS NO DEPENDENCIES AT ALL, and that is a property to preserve rather than a
# coincidence. `credpolicy` imports `std` and nothing else, deliberately, so the identical code
# builds for a developer host (where the installer runs, and where its tests run) and for
# `*-unknown-redox` (where `passwd` and the greeter run). Adding a dependency here would put it in
# the graph of every caller, which is the thing that made extraction necessary in the first place.
[package]
name = "eos-credpolicy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Password and PIN policy shared by every E-OS path that lets a person CHOOSE a secret"
repository = "https://gitlab.com/e-os/eos-userutils"

[dependencies]
